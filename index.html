<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل مصمم البطاقات</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 5px 25px #ccc;
      width: 90%;
      max-width: 450px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .download {
      display: block;
      margin-top: 30px;
      padding: 16px;
      background: #2196f3;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .download:hover {
      background: #1976d2;
    }

    #version {
      color: #777;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>مصمم البطاقات</h1>

    <p>حمّل أحدث إصدار من التطبيق</p>

    <p id="version">جاري تحميل معلومات الإصدار...</p>

    <a id="downloadButton" class="download" href="#">
      تحميل التطبيق
    </a>

  </div>

  <script>
    fetch("version.json?v=" + Date.now())
      .then(response => response.json())
      .then(data => {

        document.getElementById("version").textContent =
          "الإصدار " + data.version;

        document.getElementById("downloadButton").href =
          data.downloadUrl;

      })
      .catch(error => {

        document.getElementById("version").textContent =
          "حدث خطأ في تحميل معلومات التطبيق";

      });
  </script>

</body>
</html>
